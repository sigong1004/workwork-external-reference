<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보 처리방침 - WorkWork</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --main-text: #000000;
            --sub-text: #444444;
            --point-color: #4ADE80;
            --box-bg: #f8f9fa;
            --line-color: #eeeeee;
        }
        :root.dark-theme {
            --bg-color: #2D3436;
            --main-text: #ffffff;
            --sub-text: #C7C7C7;
            --point-color: #3B82F6;
            --box-bg: #3d4446;
            --line-color: #4a5153;
        }
        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: sans-serif;
            line-height: 1.8;
            padding: 25px;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 26px; font-weight: 900; border-bottom: 4px solid var(--point-color); padding-bottom: 15px; margin-bottom: 40px; }
        h2 { font-size: 19px; color: var(--point-color); margin-top: 40px; margin-bottom: 10px; font-weight: bold; border-left: 5px solid var(--point-color); padding-left: 12px; }
        .section { margin-bottom: 30px; }
        .content { font-size: 15px; color: var(--sub-text); }
        ul { padding-left: 20px; font-size: 15px; color: var(--sub-text); list-style-type: square; }
        li { margin-bottom: 8px; }
        .important-box { background: var(--box-bg); padding: 20px; border-radius: 15px; font-size: 14px; margin: 15px 0; border: 1px solid var(--line-color); }
        .footer { font-size: 12px; color: gray; text-align: right; margin-top: 50px; border-top: 1px solid var(--line-color); padding-top: 20px; }
        b { color: var(--main-text); }
    </style>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('theme') === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>개인정보 처리방침</h1>
        <div class="section">
            <h2>1. 수집 항목</h2>
            <div class="content">WorkWork는 <b>구글 계정 정보</b> 및 기기 내 <b>신체 활동(걸음 수)</b> 데이터를 수집합니다.</div>
        </div>
        <div class="section">
            <h2>2. 데이터 보관 및 파기</h2>
            <div class="content">수집된 데이터는 <b>Google Firebase</b>를 통해 암호화되어 관리되며, 회원 탈퇴 시 즉시 파기됩니다.</div>
        </div>
        <div class="footer">시행일자: 2024년 05월 20일</div>
    </div>
</body>
</html>
