<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 이용약관 - WorkWork</title>
    <style>
        /* 기본: 라이트 모드 변수 */
        :root {
            --bg-color: #ffffff;
            --main-text: #000000;
            --sub-text: #444444;
            --point-color: #4ADE80; /* 라이트: 녹색 */
            --box-bg: #f8f9fa;
            --line-color: #eeeeee;
        }

        /* 다크 모드 클래스 (파라미터에 의해 추가됨) */
        :root.dark-theme {
            --bg-color: #2D3436;
            --main-text: #ffffff;
            --sub-text: #C7C7C7;
            --point-color: #3B82F6; /* 다크: 파란색 */
            --box-bg: #3d4446;
            --line-color: #4a5153;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            line-height: 1.8;
            padding: 25px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 26px; font-weight: 900; border-bottom: 4px solid var(--point-color); padding-bottom: 15px; margin-bottom: 40px; }
        h2 { font-size: 19px; color: var(--point-color); margin-top: 40px; margin-bottom: 10px; font-weight: bold; border-left: 5px solid var(--point-color); padding-left: 12px; }
        .section { margin-bottom: 30px; }
        .content { font-size: 15px; color: var(--sub-text); }
        .important-box { background: var(--box-bg); padding: 20px; border-radius: 15px; font-size: 14px; margin: 15px 0; border: 1px solid var(--line-color); }
        .footer { font-size: 12px; color: gray; text-align: right; margin-top: 50px; border-top: 1px solid var(--line-color); padding-top: 20px; }
        b { color: var(--main-text); }
    </style>
    <script>
        // URL 파라미터 확인 루틴
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('theme') === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>서비스 이용약관</h1>
        <div class="section">
            <h2>제 1조 (목적)</h2>
            <div class="content">이 약관은 <b>WorkWork</b>(이하 "앱")가 제공하는 서비스 이용과 관련하여 앱과 이용자의 권리, 의무를 규정함을 목적으로 합니다.</div>
        </div>
        <div class="section">
            <h2>제 2조 (재화 및 포인트)</h2>
            <div class="important-box">
                - 미션 보상인 <b>'발도장'</b>은 가상 재화이며 현금 환불이 불가합니다.<br>
                - 아이템 구매 후 회원 탈퇴 시 모든 데이터는 소멸됩니다.
            </div>
        </div>
        <!-- (이하 상세 내용은 이전과 동일하게 유지) -->
        <div class="footer">시행일자: 2024년 05월 20일</div>
    </div>
</body>
</html>
